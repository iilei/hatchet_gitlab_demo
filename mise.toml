[tools]
poetry = "latest"
rumdl = "0.2.74"

[tasks.lint]
description = "Lint files"
run = "rumdl check ."


[tasks.fmt]
description = "Lint and format files"
run = "rumdl format ."

[tasks.hatchet-generate-keys]
description = "Generate Hatchet local encryption keysets"
run = """
#!/usr/bin/env bash
set -euo pipefail

KEY_DIR="${MISE_PROJECT_ROOT}/hatchet/encryption-keys"

mkdir -p "${KEY_DIR}"

if [[ -f "${KEY_DIR}/master.key" ]] &&
   [[ -f "${KEY_DIR}/private_ec256.key" ]] &&
   [[ -f "${KEY_DIR}/public_ec256.key" ]]; then
  echo "Hatchet encryption keys already exist:"
  echo "  ${KEY_DIR}"
  exit 0
fi

docker run --rm \
  -v "${KEY_DIR}:/encryption-keys" \
  --entrypoint /hatchet/hatchet-admin \
  ghcr.io/hatchet-dev/hatchet/hatchet-admin-dev:latest \
  keyset create-local-keys \
  --key-dir /encryption-keys

echo "Hatchet encryption keys generated:"
find "${KEY_DIR}" -maxdepth 1 -type f -print
"""

[tasks.pass]
run = """\
printf 'H%s%s%s\n' \
  "$(openssl rand -hex 8)" \
  "$(openssl rand -hex 4 | tr '[:lower:]' '[:upper:]')" \
  "$(shuf -i 0-9 -n 1)"
"""

[env]
_.file = ".env"

[tasks.hatchet-worker]
description = "Start the Hatchet deployment worker"
dir = "hello-world"
run = """
#!/usr/bin/env bash
set -euo pipefail

poetry run python src/worker.py
"""

[tasks.hatchet-run]
description = "Run the deployment workflow synchronously"
dir = "hello-world"
run = """
#!/usr/bin/env bash
set -euo pipefail

ENVIRONMENT="${1:-staging}"
VERSION="${2:-1.0.0}"

PYTHONPATH=src poetry run python - "$ENVIRONMENT" "$VERSION" <<'PY'
import sys

from workflows.deployment import DeploymentInput, deployment_workflow

result = deployment_workflow.run(
    DeploymentInput(
        environment=sys.argv[1],
        version=sys.argv[2],
    )
)

print("Deployment completed:")
print(result)
PY
"""


[tasks.hatchet-run-async]
description = "Trigger the deployment workflow without waiting"
dir = "hello-world"
run = """
#!/usr/bin/env bash
set -euo pipefail

ENVIRONMENT="${1:-staging}"
VERSION="${2:-1.0.0}"

PYTHONPATH=src poetry run python - "$ENVIRONMENT" "$VERSION" <<'PY'
import sys

from workflows.deployment import DeploymentInput, deployment_workflow

run = deployment_workflow.run(
    DeploymentInput(
        environment=sys.argv[1],
        version=sys.argv[2],
    ),
    wait_for_result=False,
)

print(f"Hatchet run started: {run}")
PY
"""
